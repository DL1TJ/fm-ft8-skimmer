# fm-ft8-skimmer settings.
#
# Copy to ~/.config/fm-ft8-skimmer/config.ini (or pass --config FILE) and change what you need.
# Every setting is optional: the values shown are the defaults. Without any file the skimmer
# listens on 144.575 MHz with the first RTL-SDR, shows its page on http://127.0.0.1:8073
# and sends nothing anywhere.
#
# Check your file with:  python3 skimmer.py --check

[station]
# Your callsign (or listener identifier) and Maidenhead locator (4, 6 or 8 characters).
# Shown on the page; required for PSK Reporter.
callsign =
locator =
# Free text, shown on the page (and sent to PSK Reporter as the antenna description).
antenna =
receiver = RTL-SDR

[receiver]
# The FM channel to listen on, in MHz (or in Hz). 144.575 MHz is the proposed FM-FT8 calling frequency.
frequency = 144.575
# Which RTL-SDR: its index (0 = the first) or its serial number.
# Note: rtl_sdr reads a serial that is a small number (such as 00000001) as an index when that
# many sticks are plugged in. With several sticks, give them serials that cannot be mistaken
# for an index (rtl_eeprom -s), or check the "Using device" line that rtl_sdr -d <serial> prints.
device = 0
# Tuner gain in dB, or auto.
gain = auto
# Frequency correction of the stick in ppm.
ppm = 0
# Optional, for sharing the stick with another program: a command that is run every 10 seconds;
# while it succeeds (exit status 0) the skimmer lets go of the stick and shows "paused".
# Run directly, without a shell. Example:  pause_when = systemctl --user is-active --quiet other-sdr.service
pause_when =

[decoder]
# The jt9 program of WSJT-X. A plain name is looked up in the PATH and in the usual WSJT-X places.
jt9 = jt9

[web]
# The built-in page. It has no login: keep it on 127.0.0.1 unless you want others on your
# network to see it (bind = 0.0.0.0), and put a reverse proxy in front for the internet.
enabled = yes
bind = 127.0.0.1
port = 8073

[pskreporter]
# Report every station heard to https://pskreporter.info under your callsign and locator.
enabled = no

[mqtt]
# Publish status, recent, stats (retained) and decode under <topic>/ to an MQTT broker.
enabled = no
host =
port = 8883
# TLS with certificate verification. Switch off only for a broker on your own network.
tls = yes
# Leave both empty for a broker that accepts anonymous clients.
# If you set a password:  chmod 600 this file.
username =
password =
topic = fmft8

[storage]
# State (so the statistics survive a restart) and the log of every decode.
directory = ~/.local/share/fm-ft8-skimmer
# How many recordings of signals that did not decode to keep, for diagnosis. 0 = none.
# These recordings can contain other people's voices: check what your law allows before enabling.
keep_audio = 0
